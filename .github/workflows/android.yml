name: Build Kaskrout Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Configure Android upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ] || [ -z "$ANDROID_STORE_PASSWORD" ]; then
            echo "Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, and ANDROID_STORE_PASSWORD in GitHub Actions secrets before building a Play-ready AAB."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kaskrout-upload-key.jks"
      - name: Validate Android signing key
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          keytool -list -keystore "$RUNNER_TEMP/kaskrout-upload-key.jks" -storepass "$ANDROID_STORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "Keystore password and alias are valid."
          keytool -certreq -alias "$ANDROID_KEY_ALIAS" -keystore "$RUNNER_TEMP/kaskrout-upload-key.jks" -storepass "$ANDROID_STORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" -file "$RUNNER_TEMP/kaskrout-upload-key.csr" >/dev/null
          rm -f "$RUNNER_TEMP/kaskrout-upload-key.csr"
          echo "Key password is valid."
      - name: Build Android App Bundle
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: >-
          dotnet publish Kaskrout.csproj -f net10.0-android -c Release
          -p:TargetFrameworks=net10.0-android -p:AndroidPackageFormat=aab
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore="$RUNNER_TEMP/kaskrout-upload-key.jks"
          -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS"
          -p:AndroidSigningKeyPass="$ANDROID_KEY_PASSWORD"
          -p:AndroidSigningStorePass="$ANDROID_STORE_PASSWORD"
          -o ./artifacts/aab
      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Kaskrout-Android-AAB
          path: artifacts/aab/*.aab
          if-no-files-found: error
          retention-days: 14
      - name: Build APK
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: >-
          dotnet publish Kaskrout.csproj -f net10.0-android -c Release
          -p:TargetFrameworks=net10.0-android -p:AndroidPackageFormat=apk
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore="$RUNNER_TEMP/kaskrout-upload-key.jks"
          -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS"
          -p:AndroidSigningKeyPass="$ANDROID_KEY_PASSWORD"
          -p:AndroidSigningStorePass="$ANDROID_STORE_PASSWORD"
          -o ./artifacts/apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kaskrout-Android-APK
          path: artifacts/apk/*.apk
          if-no-files-found: error
          retention-days: 14
