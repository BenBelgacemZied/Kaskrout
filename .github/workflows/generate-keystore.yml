name: Generate Kaskrout Keystore

on:
  workflow_dispatch:

jobs:
  generate-key:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Android signing key
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          keytool -genkeypair \
            -keystore kaskrout-upload-key.jks \
            -alias kaskrout \
            -keyalg RSA \
            -keysize 3072 \
            -validity 10000 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Kaskrout, O=Kaskrout, C=BE"
